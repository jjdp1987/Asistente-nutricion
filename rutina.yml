name: Asistente de Nutricion

on:
  schedule:
    # Se ejecuta todos los lunes a las 11:00 UTC (8:00 AM hora de Argentina)
    - cron: '0 11 * * 1'
  workflow_dispatch: # Nos permite apretar un botón para probarlo ahora mismo

jobs:
  ejecutar-asistente:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código
      uses: actions/checkout@v3

    - name: Preparar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Instalar herramientas
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai python-dotenv

    - name: Ejecutar el asistente
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
        EMAIL_CLAVE: ${{ secrets.EMAIL_CLAVE }}
      run: python asistente.py